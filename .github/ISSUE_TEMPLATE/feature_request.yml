name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Describe the user need and the outcome you want; implementation ideas are welcome but optional.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: What limitation or frustration would this address?
      placeholder: I find it difficult to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Explain the behavior or result you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or related issues.
    validations:
      required: false
