name: Setup Safe Chain
description: Install and verify Aikido Safe Chain for subsequent pnpm commands
runs:
  using: composite
  steps:
    - name: Install Safe Chain for CI
      shell: bash
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/install-safe-chain.sh"
        curl --fail --silent --show-error --location \
          https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh \
          --output "$installer"
        echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $installer" | sha256sum --check -
        sh "$installer" --ci
    - name: Verify pnpm protection
      shell: bash
      run: pnpm safe-chain-verify
