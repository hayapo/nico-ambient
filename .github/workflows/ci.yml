name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs
      - name: Validate release notes and tag on release PRs and main releases
        if: (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION=$(node scripts/version.mjs)
          node scripts/release-notes.mjs validate "$VERSION"
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$RELEASE_EVENT_NAME" = pull_request ]; then
              echo "Release tag $TAG already exists; increment the version before merging."
              exit 1
            fi
            test "$TAG_SHA" = "$GITHUB_SHA"
          fi
      - run: pnpm check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:browser:install
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  checks:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and test to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
