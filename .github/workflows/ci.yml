name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(src/|tests/|scripts/|public/|\.github/|package\.json$|pnpm-lock\.yaml$|tsconfig\.json$|vite\.config\.ts$|playwright\.config\.ts$|biome\.jsonc?$)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi
  lint:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs
      - run: pnpm check
  test:
    needs: [changes]
    if: always() && (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:browser:install
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  checks:
    needs: [changes, lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and test to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          if [ "$CHANGES_RESULT" = success ] && [ "$RELEVANT" = false ]; then
            echo 'No product, test, build, or workflow files changed; skipping lint and test.'
            exit 0
          fi
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
