name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: checks
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
    environment: release-approval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          cache: pnpm
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish matching tag and ZIP
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node scripts/version.mjs)
          TAG="v$VERSION"
          node scripts/release-notes.mjs validate "$VERSION"
          node scripts/release-notes.mjs render "$VERSION" > release-notes.md
          test "$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json')).version")" = "$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          ARCHIVE="nico-ambient-$VERSION.zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if grep -Fxq "$ARCHIVE" <<< "$ASSETS"; then
            gh release download "$TAG" --pattern "$ARCHIVE" --clobber
          else
            (cd dist && zip -r "../$ARCHIVE" . -x '*.map')
          fi
          SHA256=$(node scripts/verify-release-archive.mjs "$ARCHIVE" dist)
          if ! grep -Fxq "$ARCHIVE" <<< "$ASSETS"; then
            gh release upload "$TAG" "$ARCHIVE"
          fi
          gh release edit "$TAG" --draft=false
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
  publish-chrome-web-store:
    if: github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-chrome-web-store.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      sha256: ${{ needs.publish.outputs.sha256 }}
