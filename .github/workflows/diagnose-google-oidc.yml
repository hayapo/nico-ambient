name: Diagnose Google OIDC claims
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    environment: chrome-web-store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Print selected OIDC claims without authenticating
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'diagnostic');
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!response.ok) throw new Error(`OIDC token request failed: ${response.status}`);
          const { value } = await response.json();
          const payload = JSON.parse(Buffer.from(value.split('.')[1], 'base64url').toString('utf8'));
          const names = ['repository_owner_id', 'repository_id', 'ref', 'sub', 'workflow_ref'];
          const claims = Object.fromEntries(names.map((name) => [name, payload[name] ?? null]));
          console.log(JSON.stringify(claims, null, 2));
          NODE
