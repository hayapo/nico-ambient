name: Validate release PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  validate:
    # prepare-release creates and updates release PRs with this title format.
    if: startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - run: pnpm install --frozen-lockfile
      - name: Validate release notes and tag
        run: |
          set -euo pipefail
          VERSION=$(node scripts/version.mjs)
          node scripts/release-notes.mjs validate "$VERSION"
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag $TAG already exists; increment the version before merging."
            exit 1
          fi
